name: Peek Secret

on:
  workflow_dispatch:

jobs:
  peek-secrets:
    name: Export Secret
    runs-on: ubuntu-latest
    steps:
      - name: Save Secrets to File
        env:
          SECRET_THRE_TEAM: ${{ secrets.ThRE_Team }}
        run: |
          mkdir -p ~/secret-peek
          echo "$SECRET_THRE_TEAM" >> ~/secret-peek/secrets.txt

      - name: Upload Secret Artifact
        uses: actions/upload-artifact@v4
        with:
          name: thre-team-secret-backup
          path: ~/secret-peek/secrets.txt
